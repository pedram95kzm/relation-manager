services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: relations
      POSTGRES_USER: relations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relations -d relations"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.30
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://relations:${POSTGRES_PASSWORD}@database:5432/relations?sslmode=disable
      HTTP_ADDR: :8080
      TRUSTED_PROXIES: 172.30.0.10
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.0.20
  frontend:
    build: ./frontend
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.30.0.10
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
