name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: relations_test_ci
          POSTGRES_USER: relations_test
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relations_test -d relations_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://relations_test:ci-local-only-password@127.0.0.1:5432/relations_test_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_EMAIL: admin@relations.local
      E2E_ADMIN_PASSWORD: RelationsAdmin2026!
      E2E_DEFAULT_ACCOUNTS: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare disposable configuration
        run: bash scripts/setup-env.sh
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check frontend and proxied API
        run: |
          curl --fail --retry 3 http://localhost:5173/
          curl --fail --retry 3 http://localhost:5173/api/v1/health/ready
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test real browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Stop disposable stack
        if: always()
        run: docker compose down
